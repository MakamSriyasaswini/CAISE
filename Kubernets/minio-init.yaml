apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: caise
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: caise-config
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: caise-config
                  key: MINIO_SECRET_KEY
            - name: MINIO_BUCKET
              valueFrom:
                secretKeyRef:
                  name: caise-config
                  key: MINIO_BUCKET
            - name: MINIO_B_BUCKET
              valueFrom:
                secretKeyRef:
                  name: caise-config
                  key: MINIO_B_BUCKET
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set minioa http://minio-a:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"; do sleep 2; done
              until mc alias set miniob http://minio-b:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"; do sleep 2; done
              mc mb --ignore-existing "minioa/$MINIO_BUCKET"
              mc mb --ignore-existing "miniob/$MINIO_B_BUCKET"