apiVersion: apps/v1
kind: Deployment
metadata:
  name: caise-gateway
  namespace: caise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caise-gateway
  template:
    metadata:
      labels:
        app: caise-gateway
    spec:
      containers:
        - name: gateway
          image: caise-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: caise-config
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: caise-gateway
  namespace: caise
spec:
  type: NodePort
  selector:
    app: caise-gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080